appId: com.opengis.desktop
productName: OpenGIS
directories:
  buildResources: resources
  output: dist

files:
  - "out/**/*"
  # Development-only Python manager stays in the repository but is never shipped.
  - "!out/electron/chunks/pythonManager-*.js"
  - "resources/icons/**/*"

extraResources:
  - from: "java-backend/server/target/runtime/"
    to: "java-runtime/"
    filter:
      - "**/*"
  - from: "java-backend/server/target/opengis-server-0.1.0-SNAPSHOT.jar"
    to: "java-backend/opengis-server.jar"
  - from: "resources/icons/"
    to: "icons/"
    filter:
      - "**/*"

win:
  # Phase 9 produces unsigned verification packages. Enable executable editing
  # together with a real certificate in the release-signing phase.
  signAndEditExecutable: false
  target:
    - nsis
    - portable
  icon: resources/icons/app-icon.png
  artifactName: "${productName}-${version}-win-${arch}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
