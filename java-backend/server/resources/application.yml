spring:
  application:
    name: opengis-server
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  address: 127.0.0.1
  port: 8765
  shutdown: graceful

opengis:
  runtime:
    version: 0.1.0
    log-dir: ${logging.file.path}
  skills:
    max-skill-bytes: ${OPENGIS_SKILL_MAX_BYTES:262144}
    max-resource-bytes: ${OPENGIS_SKILL_RESOURCE_MAX_BYTES:10485760}
    max-resource-read-chars: ${OPENGIS_SKILL_RESOURCE_READ_CHARS:50000}
    max-resources: ${OPENGIS_SKILL_MAX_RESOURCES:512}
    max-run-resource-chars: ${OPENGIS_SKILL_RUN_RESOURCE_CHARS:200000}

logging:
  file:
    path: ${OPENGIS_LOG_DIR:${java.io.tmpdir}/opengis/logs}
  level:
    root: INFO
    org.opengis: INFO
